<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentHeadroom Providers</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --page: #f5f5f7;
        --card: #ffffff;
        --text: rgba(0, 0, 0, .88);
        --secondary: rgba(0, 0, 0, .50);
        --border: rgba(0, 0, 0, .10);
        --hover: rgba(0, 0, 0, .05);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--page); color: var(--text); -webkit-font-smoothing: antialiased; }
      .page { width: min(100%, 620px); margin: 0 auto; padding: 28px 24px 32px; }
      .top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
      .top-copy { flex: 1; }
      h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
      .intro { margin: 5px 0 0; color: var(--secondary); font-size: 12px; line-height: 1.45; }
      #providers { display: grid; gap: 8px; }
      .provider { display: grid; grid-template-columns: 1fr auto; gap: 9px 16px; padding: 14px 15px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); box-shadow: 0 1px 1px rgba(0, 0, 0, .025); }
      .name { font-size: 13px; font-weight: 600; }
      .meta { margin-top: 4px; color: var(--secondary); font-size: 11px; line-height: 1.4; }
      .value { align-self: center; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      input { min-width: 0; height: 30px; padding: 0 9px; border: 1px solid var(--border); border-radius: 6px; outline: none; background: var(--card); color: var(--text); font: inherit; font-size: 11px; }
      input:focus { border-color: rgba(0, 122, 255, .65); box-shadow: 0 0 0 2px rgba(0, 122, 255, .12); }
      .cursor-key { flex: 1 1 230px; }
      button { height: 30px; padding: 0 10px; border: 1px solid rgba(0, 122, 255, .8); border-radius: 6px; background: #007aff; color: white; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600; }
      button:hover { filter: brightness(.97); }
      button.secondary { border-color: var(--border); background: transparent; color: var(--text); }
      button.secondary:hover { background: var(--hover); }
      button.danger { border-color: transparent; background: transparent; color: #c9362b; }
      .toolbar { flex: none; display: flex; }
      .notice { margin: 16px 2px 0; color: var(--secondary); font-size: 10px; line-height: 1.5; }
      .message { min-height: 17px; margin: 0 2px 8px; color: #c9362b; font-size: 11px; }
      @media (prefers-color-scheme: dark) {
        :root { --page: #1e1e20; --card: #2b2b2d; --text: rgba(255,255,255,.90); --secondary: rgba(255,255,255,.48); --border: rgba(255,255,255,.10); --hover: rgba(255,255,255,.06); }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div class="top-copy"><h1>연결</h1><p class="intro">공식 CLI, API 또는 설치한 로컬 어댑터에서 사용량을 가져옵니다.</p></div>
        <div class="toolbar"><button class="secondary" id="open-adapters">어댑터 폴더</button></div>
      </header>
      <p class="message" id="message" role="status"></p>
      <main id="providers"></main>
      <p class="notice">기존 로그인 정보와 브라우저 쿠키는 읽지 않습니다. 직접 연결한 API 키만 운영체제 보안 저장소로 암호화합니다.</p>
    </div>
    <script src="./settings.js"></script>
  </body>
</html>
