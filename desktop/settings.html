<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentHeadroom Providers</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: Canvas; color: CanvasText; }
      h1 { margin: 0; font-size: 22px; }
      .intro { margin: 7px 0 20px; color: color-mix(in srgb, CanvasText 62%, transparent); font-size: 13px; line-height: 1.5; }
      #providers { display: grid; gap: 10px; }
      .provider { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; padding: 14px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 12px; }
      .name { font-weight: 700; }
      .meta { margin-top: 4px; color: color-mix(in srgb, CanvasText 58%, transparent); font-size: 12px; }
      .value { align-self: center; font-size: 24px; font-weight: 750; font-variant-numeric: tabular-nums; }
      .actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
      input { min-width: 0; padding: 8px 10px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 8px; background: Canvas; color: CanvasText; }
      input[type=number] { width: 84px; }
      input[type=datetime-local] { width: 190px; }
      button { padding: 8px 11px; border: 0; border-radius: 8px; background: #5b66e8; color: white; cursor: pointer; font-weight: 650; }
      button.secondary { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); background: transparent; color: CanvasText; }
      button.danger { background: transparent; color: #e5484d; }
      .custom { margin-top: 20px; padding-top: 18px; border-top: 1px solid color-mix(in srgb, CanvasText 14%, transparent); }
      .custom-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; }
      .notice { margin-top: 18px; color: color-mix(in srgb, CanvasText 55%, transparent); font-size: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>AgentHeadroom</h1>
    <p class="intro">Codex는 자동으로 동기화됩니다. 공식 잔여량 API가 없는 에이전트는 사용량 페이지에서 확인한 남은 %를 기록하세요.</p>
    <main id="providers"></main>
    <section class="custom">
      <div class="custom-row">
        <input id="custom-name" maxlength="60" placeholder="에이전트 이름" />
        <input id="custom-url" type="url" placeholder="https:// 사용량 페이지 (선택)" />
        <button id="add">추가</button>
      </div>
    </section>
    <p class="notice">AgentHeadroom은 로그인 쿠키나 인증 토큰을 읽지 않습니다. 수동 값은 이 컴퓨터에만 저장됩니다.</p>
    <script src="./settings.js"></script>
  </body>
</html>
