name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build macOS apps
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create checksums
        run: |
          cd dist-cross
          shasum -a 256 *.zip > AgentHeadroom-v${GITHUB_REF_NAME#v}-macOS.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist-cross/*.zip
            dist-cross/*.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create checksum
        shell: pwsh
        run: |
          $asset = Get-ChildItem dist-cross/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($asset.Name)" | Set-Content "$($asset.FullName).sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist-cross/*.exe
            dist-cross/*.sha256

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Linux AppImage
        run: npm run dist:linux
      - name: Create checksum
        run: |
          cd dist-cross
          sha256sum *.AppImage > AgentHeadroom-v${GITHUB_REF_NAME#v}-Linux-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist-cross/*.AppImage
            dist-cross/*.sha256

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgentHeadroom $GITHUB_REF_NAME" \
            --generate-notes
